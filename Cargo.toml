[workspace]
resolver = "2"
members = [
    "crates/aabox-proto",
    "crates/aabox-common",
    "crates/aabox-aapd",
    "crates/aabox-resigner",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
authors = ["Chris Nickl <cknickl@outlook.com>"]
repository = "https://github.com/cknickl/aabox"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Protobuf
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"

# TLS for the AA SSL handshake — pure-Rust, no OpenSSL dependency on Android
# Using ring as the crypto provider (lighter cross-compile than aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }

# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Byte buffer manipulation (USB / AA framing)
bytes = "1"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Android JNI (used by aabox-aapd to expose interface to Kotlin/Java)
jni = "0.21"

# Linux/Android-only: netlink socket + uevent parsing for USB gadget hot-swap
netlink-sys = "0.8"
kobject-uevent = "0.1"

# POSIX bits (file flags, ioctls) — used by the USB stream layer
nix = { version = "0.29", features = ["fs", "ioctl", "mount"] }

# JSON (OSRM responses, nav destination config file)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for online routing (OSRM / Valhalla). rustls-tls only so we don't
# pull native-tls / OpenSSL — aabox already standardises on rustls 0.23 + ring.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }

# `async fn` in trait objects. Only place we need it is the AudioSink/Source
# traits in aabox-aapd; the stable Rust `async fn` in traits doesn't yet
# support dyn dispatch (`dyn AudioSink`), and we need that to swap concrete
# backends at runtime (logging sink vs. Android sink, etc.).
async-trait = "0.1"
