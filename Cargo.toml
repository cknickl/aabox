[workspace]
resolver = "2"
members = [
    "crates/aabox-proto",
    "crates/aabox-common",
    "crates/aabox-aapd",
    "crates/aabox-resigner",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
authors = ["Chris Nickl <cknickl@outlook.com>"]
repository = "https://github.com/cknickl/aabox"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Protobuf
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"

# TLS for the AA SSL handshake — pure-Rust, no OpenSSL dependency on Android
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = "2"

# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Byte buffer manipulation (USB / AA framing)
bytes = "1"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Android JNI (used by aabox-aapd to expose interface to Kotlin/Java)
jni = "0.21"

# Linux/Android-only: netlink socket + uevent parsing for USB gadget hot-swap
netlink-sys = "0.8"
kobject-uevent = "0.1"

# POSIX bits (file flags, ioctls) — used by the USB stream layer
nix = { version = "0.29", features = ["fs", "ioctl"] }
