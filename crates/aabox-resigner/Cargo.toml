[package]
name = "aabox-resigner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "On-device service that intercepts failed CarCar updates, patches the dex, re-signs with AABox platform key, retries install."

[[bin]]
name = "aabox-resigner"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
aabox-common = { path = "../aabox-common" }

tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
